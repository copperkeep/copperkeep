# Single-origin front for the k3d smoke test, standing in for the Ingress. Routes the
# same paths to port-forwarded services so the assertions are identical to Compose's.
server {
    listen 18443;
    server_name _;

    location /v1/      { proxy_pass http://127.0.0.1:18000; }
    location = /healthz { proxy_pass http://127.0.0.1:18000/healthz; }
    location = /readyz  { proxy_pass http://127.0.0.1:18000/readyz; }
    location /content/ { proxy_pass http://127.0.0.1:18081/; }
    location /         { proxy_pass http://127.0.0.1:18080; }
}
