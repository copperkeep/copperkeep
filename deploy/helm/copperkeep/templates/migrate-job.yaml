{{/*
Migrations run as a Helm hook, never on API startup — otherwise deploy order and replica
count start mattering (§9.1 rule 4).

post-install rather than pre-install, deliberately. In embedded mode Postgres is an
ordinary chart resource, and Helm applies pre-install hooks *before* ordinary resources,
so a pre-install migration would have no database to connect to on a fresh install.
pre-upgrade is what the coupling rule actually cares about — new schema in place before
new pods roll — and that is preserved.

The job waits for the database rather than assuming it is up, because on install it can
start while Postgres is still coming up.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "copperkeep.fullname" . }}-migrate
  labels:
    {{- include "copperkeep.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "copperkeep.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "copperkeep.image" (dict "root" . "name" "api" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["copperkeep-migrate"]
          env:
            {{- include "copperkeep.apiEnv" . | nindent 12 }}
          resources:
            requests: { memory: 128Mi, cpu: 100m }
