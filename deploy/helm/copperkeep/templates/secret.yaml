{{- if not .Values.api.existingSecret }}
{{/*
Generated once and preserved across upgrades: `lookup` reads the live secret so a
`helm upgrade` does not rotate the session key and sign every learner out mid-lesson.

Provide api.existingSecret to manage these yourself.
*/}}
{{- $name := printf "%s-secrets" (include "copperkeep.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $data := (default dict (get $existing "data")) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "copperkeep.labels" . | nindent 4 }}
  annotations:
    # A hook, and one that sorts ahead of everything that reads it.
    #
    # Helm applies pre-install hooks BEFORE the chart's ordinary resources. Postgres and
    # the API both need these keys at startup, and the pre-upgrade migration Job needs
    # them before either. Rendered as an ordinary resource, the Secret would not exist
    # when the upgrade hook runs and the pod would sit in CreateContainerConfigError
    # until the install timed out.
    #
    # before-hook-creation is safe despite the generated passwords: `lookup` above reads
    # the live Secret at render time, so the values are captured in this manifest before
    # anything is deleted. It does mean the Secret outlives `helm uninstall`, which
    # matches the StatefulSet's PVC — both are deliberately kept.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  session-secret: {{ .Values.api.sessionSecret | default (get $data "session-secret" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  admin-token: {{ .Values.api.adminToken | default (get $data "admin-token" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  {{- if eq .Values.postgres.mode "embedded" }}
  {{/* Only embedded mode owns a password. In operator and external modes the connection
       string comes from elsewhere, so generating one here would be an unused secret that
       rotates on every render. */}}
  postgres-password: {{ .Values.postgres.password | default (get $data "postgres-password" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}
  {{- end }}
  bootstrap-admin-password: {{ .Values.api.bootstrap.adminPassword | default (get $data "bootstrap-admin-password" | b64dec) | default (randAlphaNum 16) | b64enc | quote }}
{{- end }}
