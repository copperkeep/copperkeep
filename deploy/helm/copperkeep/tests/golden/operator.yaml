# Source: copperkeep/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copperkeep-copperkeep-api
  labels:
    helm.sh/chart: copperkeep-0.1.1
    app.kubernetes.io/name: copperkeep
    app.kubernetes.io/instance: copperkeep
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: copperkeep
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copperkeep
      app.kubernetes.io/instance: copperkeep
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copperkeep
        app.kubernetes.io/instance: copperkeep
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/copperkeep/api:0.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: COPPERKEEP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: copperkeep-db-app
                  key: uri
            - name: COPPERKEEP_APP_VERSION
              value: "0.1.1"
            - name: COPPERKEEP_LOG_LEVEL
              value: "INFO"
            - name: COPPERKEEP_CONTENT_BASE_URL
              value: http://copperkeep-copperkeep-content:8080
            - name: COPPERKEEP_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: copperkeep-copperkeep-secrets
                  key: session-secret
            - name: COPPERKEEP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copperkeep-copperkeep-secrets
                  key: admin-token
            
            - name: COPPERKEEP_COOKIE_SECURE
              value: "true"
            - name: COPPERKEEP_AUTH_BACKOFF_AFTER
              value: "3"
            - name: COPPERKEEP_AUTH_HARD_LOCK_AFTER
              value: "10"
            - name: COPPERKEEP_EVENT_WRITES_PER_MINUTE
              value: "240"
            - name: COPPERKEEP_SUBMISSION_MAX_BYTES
              value: "64000"
            - name: COPPERKEEP_MASTERY_THRESHOLD
              value: "0.9"
            - name: COPPERKEEP_MASTERY_MIN_OPPORTUNITIES
              value: "3"
            - name: COPPERKEEP_MASTERY_MIN_STEP_TYPES
              value: "2"
            - name: COPPERKEEP_REVIEW_INTERVALS_DAYS
              value: "[3,7,21]"
            - name: COPPERKEEP_TUTOR_ENABLED
              value: "false"
            - name: COPPERKEEP_BOOTSTRAP_ORG_SLUG
              value: "home"
            - name: COPPERKEEP_BOOTSTRAP_ORG_NAME
              value: "Home"
            - name: COPPERKEEP_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: COPPERKEEP_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copperkeep-copperkeep-secrets
                  key: bootstrap-admin-password
          # Ready means the database answers AND the loaded curriculum is compatible, so
          # a minAppVersion mismatch never goes live (§11.1).
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness deliberately uses /healthz: content being unreachable must degrade,
          # not restart the pod in a loop (§9.1 rule 7).
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

