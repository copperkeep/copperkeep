apiVersion: batch/v1
kind: CronJob
metadata:
  name: copperkeep-copperkeep-reviews
  labels:
    helm.sh/chart: copperkeep-0.1.1
    app.kubernetes.io/name: copperkeep
    app.kubernetes.io/instance: copperkeep
    app.kubernetes.io/version: "0.1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: copperkeep
    app.kubernetes.io/component: review-scheduler
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: schedule-reviews
              image: curlimages/curl:8.10.1
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: copperkeep-copperkeep-secrets
                      key: admin-token
              command:
                - /bin/sh
                - -c
                - |
                  curl -fsS -X POST \
                    -H "X-Copperkeep-Admin-Token: ${ADMIN_TOKEN}" \
                    http://copperkeep-copperkeep-api:8000/v1/admin/reviews/schedule

