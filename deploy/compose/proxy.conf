# The single public origin, path-routed — the Compose equivalent of the Ingress.
#
# COOP/COEP are set by the web service on the document it serves and passed through
# untouched here. If you put anything in front of this, check it does not strip them:
# open /#conformance and confirm crossOriginIsolated is true.

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
    }

    location /content/ {
        proxy_pass http://content:8080/;
    }

    location /audio/ {
        proxy_pass http://audio:8080/;
    }

    location /runtimes/ {
        proxy_pass http://runtimes:8080/;
    }

    location / {
        proxy_pass http://web:8080;
    }
}
