server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation is set on the DOCUMENT, which this service serves. Putting
    # it here rather than in ingress annotations makes it portable — Traefik needs a
    # Middleware CRD, nginx-ingress needs a snippet, Compose needs neither — and means
    # one place to get it right. Every other service carries CORP; same origin, so
    # subresources are fine.
    #
    # Without these two headers SharedArrayBuffer is unavailable and every infinite loop
    # takes the worker-termination path instead of interrupt() (§4).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed assets are immutable; index.html and config.json never are.
    # add_header does not inherit into a location block that declares its own, so the
    # isolation headers are repeated wherever one is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
