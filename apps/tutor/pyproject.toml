[project]
name = "copperkeep-tutor"
version = "0.1.6"
description = "Optional LLM guidance service — holds the endpoint connection and the prompts"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copperkeep_tutor"]

[tool.ruff]
line-length = 100
target-version = "py312"
