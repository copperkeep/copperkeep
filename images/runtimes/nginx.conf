server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Downloaded once per device, then served from Cache Storage. Runtime assets are
    # immutable: the version is in the path.
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    types {
        application/wasm wasm;
        application/javascript js mjs;
        application/json json;
        application/octet-stream whl;
        text/html html;
    }

    gzip on;
    gzip_types application/javascript application/json application/wasm;

    location = /healthz {
        access_log off;
        expires -1;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }
}
