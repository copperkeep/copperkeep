server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No application logic and no database connection: this is a file server whose
    # contents are versioned and rolled back with the image.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Short cache: a prose typo fix should reach a learner on the next lesson load, and
    # the payload is ~2MB of JSON.
    expires 5m;
    add_header Cache-Control "public, max-age=300" always;

    gzip on;
    gzip_types application/json text/plain;

    location = /healthz {
        access_log off;
        expires -1;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
